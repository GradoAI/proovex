name: DevFlow Reconcile

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      result_envelope:
        description: Explicit ResultEnvelope JSON for recovery/testing
        required: false
        type: string
      review_packet_id:
        description: AlignmentReviewPacket ID for Human Review Decision
        required: false
        type: string
      review_decision:
        description: CONTINUE | CORRECTION_REQUIRED | TOP_LEVEL_DECISION_REQUIRED
        required: false
        type: string
      devflow_test_only:
        description: Route explicit review decision to fixed devflow/e2e-state
        required: false
        default: false
        type: boolean

concurrency:
  group: devflow-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run architecture
      - run: npm run build

      - name: Adapt GitHub event
        id: adapt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          event="$RUNNER_TEMP/devflow-event.json"
          cp "$GITHUB_EVENT_PATH" "$event"
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            pr_number=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$event")
            if [ -n "$pr_number" ]; then
              gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '{number,body,head_sha:.head.sha,merge_commit_sha,merged,base_ref:.base.ref}' > "$RUNNER_TEMP/devflow-pr.json"
              jq --slurpfile pr "$RUNNER_TEMP/devflow-pr.json" '. + {devflow_pr: $pr[0]}' "$event" > "$RUNNER_TEMP/devflow-event-enriched.json"
              event="$RUNNER_TEMP/devflow-event-enriched.json"
            fi
          fi
          node tools/devflow/github-event.ts < "$event" > "$RUNNER_TEMP/devflow-adapter.json"
          cat "$RUNNER_TEMP/devflow-adapter.json"
          echo "kind=$(jq -r '.kind' "$RUNNER_TEMP/devflow-adapter.json")" >> "$GITHUB_OUTPUT"
          echo "state_target=$(jq -r '.state_target' "$RUNNER_TEMP/devflow-adapter.json")" >> "$GITHUB_OUTPUT"

      - name: Load latest durable state
        env:
          STATE_TARGET: ${{ steps.adapt.outputs.state_target }}
        run: |
          case "$STATE_TARGET" in
            canonical) state_branch='devflow/state' ;;
            e2e) state_branch='devflow/e2e-state' ;;
            *) echo "invalid state target" >&2; exit 1 ;;
          esac
          if git fetch origin "refs/heads/${state_branch}:refs/remotes/origin/${state_branch}"; then
            git show "refs/remotes/origin/${state_branch}:.grado/devflow/state.json" > .grado/devflow/state.json
          elif [ "$STATE_TARGET" = e2e ] && git fetch origin refs/heads/devflow/state:refs/remotes/origin/devflow/state; then
            git show refs/remotes/origin/devflow/state:.grado/devflow/state.json > .grado/devflow/state.json
          fi

      - name: Reconcile ResultEnvelope
        if: steps.adapt.outputs.kind == 'RECONCILE'
        run: jq -c '.envelope' "$RUNNER_TEMP/devflow-adapter.json" | node tools/devflow/devflow.ts reconcile

      - name: Record Human Review Decision
        if: steps.adapt.outputs.kind == 'REVIEW'
        run: jq -c '.review' "$RUNNER_TEMP/devflow-adapter.json" | node tools/devflow/devflow.ts review-record

      - name: Explain skipped reconciliation
        if: steps.adapt.outputs.kind == 'NO_RECONCILIATION'
        run: |
          jq -r '"NO_RECONCILIATION: " + .reason' "$RUNNER_TEMP/devflow-adapter.json"

      - name: Publish durable state projection
        if: steps.adapt.outputs.kind == 'RECONCILE' || steps.adapt.outputs.kind == 'REVIEW'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_TARGET: ${{ steps.adapt.outputs.state_target }}
        run: |
          case "$STATE_TARGET" in
            canonical) state_branch='devflow/state' ;;
            e2e) state_branch='devflow/e2e-state' ;;
            *) echo "invalid state target" >&2; exit 1 ;;
          esac
          state_dir="$RUNNER_TEMP/devflow-state"
          if git fetch origin "refs/heads/${state_branch}:refs/remotes/origin/${state_branch}"; then
            git worktree add --detach "$state_dir" "refs/remotes/origin/${state_branch}"
          else
            git init "$state_dir"
            git -C "$state_dir" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          git -C "$state_dir" config user.name "github-actions[bot]"
          git -C "$state_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find "$state_dir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p "$state_dir/.grado/devflow"
          cp .grado/devflow/state.json "$state_dir/.grado/devflow/state.json"
          git -C "$state_dir" add -A
          git -C "$state_dir" diff --cached --quiet || git -C "$state_dir" commit -m "chore(devflow): update durable state"
          git -C "$state_dir" push origin "HEAD:refs/heads/${state_branch}"

      - name: Show projection
        run: node tools/devflow/devflow.ts status --json
